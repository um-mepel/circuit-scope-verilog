[package]
name = "verilog-mcp"
version = "0.3.0"
edition = "2021"
description = "Model Context Protocol server exposing Circuit Scope's Verilog compiler, VCD viewer, and stepping debugger."
license = "MIT"
repository = "https://github.com/um-mepel/circuit-scope-verilog"

[[bin]]
name = "verilog-mcp"
path = "src/main.rs"

[dependencies]
verilog_core = { path = "../verilog-core" }
rmcp = { version = "1.7", features = ["transport-io"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
anyhow = "1"
wellen = "=0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
